{% extends "base.html" %}
{% block title %}Clientes | TechBol{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Clientes</h2><a class="btn btn-primary" href="{{ url_for('clientes.nuevo') }}">+ Nuevo cliente</a></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-striped mb-0">
<thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Acciones</th></tr></thead><tbody>
{% for c in clientes %}<tr><td>{{ c.id }}</td><td>{{ c.nombre }}</td><td>{{ c.telefono }}</td><td class="d-flex gap-2">
<a class="btn btn-sm btn-warning" href="{{ url_for('clientes.editar', id=c.id) }}">Editar</a>
<form method="post" action="{{ url_for('clientes.eliminar', id=c.id) }}" onsubmit="return confirm('¿Eliminar este cliente?')"><button class="btn btn-sm btn-danger">Eliminar</button></form>
</td></tr>{% else %}<tr><td colspan="4" class="text-center py-4">No hay clientes registrados.</td></tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
