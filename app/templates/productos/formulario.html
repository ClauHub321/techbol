{% extends "base.html" %}
{% block title %}Producto | TechBol{% endblock %}
{% block content %}
<h2 class="mb-3">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h2>
<form method="post" class="card card-body shadow-sm" style="max-width:600px">
  <label class="form-label">Nombre</label><input class="form-control mb-3" name="nombre" required maxlength="120" value="{{ producto.nombre if producto else '' }}">
  <label class="form-label">Precio (Bs)</label><input class="form-control mb-3" type="number" name="precio" min="0" step="0.01" required value="{{ producto.precio if producto else '' }}">
  <label class="form-label">Stock</label><input class="form-control mb-3" type="number" name="stock" min="0" step="1" required value="{{ producto.stock if producto else '' }}">
  <div><button class="btn btn-primary">Guardar</button> <a class="btn btn-secondary" href="{{ url_for('productos.listar') }}">Cancelar</a></div>
</form>
{% endblock %}
